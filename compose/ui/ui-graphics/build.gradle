import androidx.build.SoftwareType
import androidx.build.PlatformIdentifier
import org.jetbrains.kotlin.gradle.dsl.JvmTarget
import org.jetbrains.kotlin.gradle.plugin.KotlinPlatformType
import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

plugins {
    id("AndroidXPlugin")
    id("AndroidXComposePlugin")
    id("JetBrainsAndroidXPlugin")
}

def composeWinUiJvmTargetEnabled = providers
        .gradleProperty("composeWinUi.enableJvmTarget")
        .map { it.toBoolean() }
        .orElse(false)
        .get()
def composeWinUiMingwTargetEnabled = providers
        .gradleProperty("composeWinUi.enableMingwTarget")
        .map { it.toBoolean() }
        .orElse(false)
        .get()
def composeWinUiTargetEnabled = composeWinUiJvmTargetEnabled || composeWinUiMingwTargetEnabled
def composeWinUiGradlePluginAvailable = JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_22)
def composeWinUiSkikoWinUiVersion = providers
        .gradleProperty("composeWinUi.skikoWinUiVersion")
        .orElse("0.0.0-SNAPSHOT")

androidXMultiplatform {
    androidLibrary {
        compileSdk = 35
        namespace = "androidx.compose.ui.graphics"
        androidResources.enable = true
        optimization {
            it.consumerKeepRules.publish = true
            it.consumerKeepRules.files.add(new File("proguard-rules.pro"))
        }
    }
    if (!composeWinUiTargetEnabled) {
        desktop()
    }
    mac()
    ios()
    js()
    wasmJs()

    defaultPlatform(PlatformIdentifier.ANDROID)

    configureDarwinFlags()

    sourceSets {
        commonMain.dependencies {
            api(libs.androidx.annotation)

            api(project(":compose:ui:ui-unit"))
            implementation(project(":compose:runtime:runtime"))
            implementation(project(":compose:ui:ui-util"))
            implementation("androidx.collection:collection:1.5.0")
        }

        commonTest.dependencies {
            implementation(kotlin("test"))
        }

        androidMain.dependencies {
            // This has stub APIs for access to legacy Android APIs, so we don't want
            // any dependency on this module.
            compileOnly(project(":compose:ui:ui-android-stubs"))
            implementation("androidx.graphics:graphics-path:1.0.1")
            implementation libs.androidx.core
            api("androidx.annotation:annotation-experimental:1.4.1")
        }

        androidDeviceTest.dependencies {
            implementation(project(":compose:ui:ui-graphics:ui-graphics-samples"))
            implementation(project(":compose:ui:ui-test-junit4"))
            implementation(project(":compose:test-utils"))
            implementation(libs.testRules)
            implementation(libs.testRunner)
            implementation(libs.espressoCore)
            implementation(libs.junit)
            implementation(libs.truth)
        }

        androidHostTest.dependencies {
            implementation(libs.testRules)
            implementation(libs.testRunner)
            implementation(libs.junit)
            implementation(libs.truth)
            implementation(project(":compose:test-utils"))
        }

        // TODO: Align naming: nonAndroidMain
        skikoMain {
            dependsOn(commonMain)
            dependencies {
                api(libs.skiko)
            }
        }

        skikoTest {
            dependsOn(commonTest)
            dependencies {
                implementation(project(":compose:ui:ui-test"))
                implementation(project(":kruth:kruth"))
            }
        }

        skikoExcludingWebMain {
            dependsOn(skikoMain)
        }

        skikoExcludingWebTest {
            dependsOn(skikoTest)
        }

        desktopMain {
            dependsOn(skikoMain)
            dependsOn(skikoExcludingWebMain)
        }

        desktopTest {
            dependsOn(skikoTest)
            dependsOn(skikoExcludingWebTest)
            resources.srcDirs += "src/desktopTest/res"
            dependencies {
                implementation(libs.junit)
                implementation(libs.truth)
                implementation(libs.skikoCurrentOs)
                implementation(project(":compose:ui:ui-test-junit4"))
            }
        }

        nonJvmMain {
            if (!composeWinUiTargetEnabled) {
                dependsOn(skikoMain)
            }
            dependencies {
                // To comply with Klib resolver until https://youtrack.jetbrains.com/issue/KT-61096 is fixed
                implementation("org.jetbrains.compose.collection-internal:collection:1.10.0")
            }
        }

        nonJvmTest {
            dependsOn(skikoTest)
        }

        nativeMain {
            dependsOn(nonJvmMain)
            dependsOn(skikoExcludingWebMain)
        }

        nativeTest {
            dependsOn(nonJvmTest)
            dependsOn(skikoExcludingWebTest)
        }

        wasmJsMain {
            dependencies {
                implementation(libs.skikoWasmJs)
                implementation(libs.skikoJsWasmRuntime)
            }
        }
    }
}

kotlin {
    if (composeWinUiGradlePluginAvailable) {
        if (composeWinUiJvmTargetEnabled) {
            jvm("winuiJvm")
        }
        if (composeWinUiMingwTargetEnabled) {
            mingwX64("winuiMingw")
        }

        sourceSets {
            winuiMain {
                dependsOn(skikoMain)
                dependsOn(skikoExcludingWebMain)
            }

            winuiTest {
                dependsOn(commonTest)
            }

            if (composeWinUiJvmTargetEnabled) {
                winuiJvmMain {
                    dependsOn(winuiMain)
                }
                winuiJvmTest {
                    dependsOn(winuiTest)
                    dependencies {
                        runtimeOnly("io.github.compose-fluent:skiko-winui-windows:${composeWinUiSkikoWinUiVersion.get()}")
                    }
                }
            }

            if (composeWinUiMingwTargetEnabled) {
                winuiMingwMain {
                    dependsOn(winuiMain)
                }
                winuiMingwTest {
                    dependsOn(winuiTest)
                }
            }

        }
    }
}

if (composeWinUiGradlePluginAvailable && composeWinUiTargetEnabled) {
    configurations.configureEach { configuration ->
        def lowerName = configuration.name.toLowerCase(Locale.ROOT)
        if (lowerName.contains("winui")) {
            configuration.attributes.attribute(
                    org.gradle.api.attributes.java.TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE,
                    25
            )
            configuration.resolutionStrategy.dependencySubstitution {
                substitute(module("org.jetbrains.skiko:skiko"))
                        .using(module("io.github.compose-fluent:skiko-winui:${composeWinUiSkikoWinUiVersion.get()}"))
                        .because("compose-winui uses skiko-winui as the WinUI replacement for the regular Skiko distribution.")
            }
        }
    }
}

dependencies {
    lintPublish(project(":compose:ui:ui-graphics-lint"))
}

androidx {
    name = "Compose Graphics"
    type = SoftwareType.PUBLISHED_LIBRARY_ONLY_USED_BY_KOTLIN_CONSUMERS
    inceptionYear = "2020"
    description = "Compose graphics"
    legacyDisableKotlinStrictApiMode = true
    enableRobolectric()
    samples(project(":compose:ui:ui-graphics:ui-graphics-samples"))
}

// TODO(b/407640608): Task :compose:ui:ui-inspection:connectedCheck fails without this block
tasks.withType(KotlinCompile).configureEach { task ->
    if (task.name == "compileAndroidMain") {
        task.compilerOptions {
            it.freeCompilerArgs.addAll("-Xlambdas=class")
        }
    }
    if (task.name.contains("Winui")) {
        task.compilerOptions {
            it.jvmTarget.set(JvmTarget.JVM_25)
            it.freeCompilerArgs.add("-Xjdk-release=25")
        }
    }
}

tasks.findByName("desktopTest")?.configure {
    systemProperties["GOLDEN_PATH"] = project.rootDir.absolutePath + "/golden"
}
