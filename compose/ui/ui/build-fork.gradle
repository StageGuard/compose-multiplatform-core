            dependsOn(commonMain)
            dependencies {
                api(project(":compose:ui:ui-skiko"))
                implementation(libs.atomicFu)
            }
        }

        skikoMain {
            dependsOn(skikoRenderingMain)
        }
    }

    if (composeWinUiGradlePluginAvailable) {
        jvm("winuiJvm")
        // Enable a WinUI mingw target after kotlin-winrt provides its mingw runtime actuals.

        sourceSets {
            winuiMain {
                dependsOn(skikoRenderingMain)
                dependencies {
                    def lifecycleVersion = project.redirectVersions.get('androidx.lifecycle')
                    implementation("io.github.compose-fluent:skiko-winui:${composeWinUiSkikoWinUiVersion.get()}")
                    implementation("io.github.compose-fluent:winrt-runtime:${kotlinWinRtVersion.get()}")
                    implementation("io.github.compose-fluent:winrt-authoring:${kotlinWinRtVersion.get()}")
                    implementation("org.jetbrains.androidx.navigationevent:navigationevent-compose:1.1.0")
                    implementation("androidx.lifecycle:lifecycle-viewmodel-compose:$lifecycleVersion")
                    implementation("androidx.lifecycle:lifecycle-viewmodel-savedstate:$lifecycleVersion")
                }
            }

            winuiTest {
                dependencies {
                    implementation(libs.kotlinTest)
                }
            }

            winuiJvmMain {
                dependsOn(winuiMain)
                dependencies {
                    runtimeOnly("io.github.compose-fluent:skiko-winui-windows:${composeWinUiSkikoWinUiVersion.get()}")
                }
            }

            winuiJvmTest {
                dependsOn(winuiTest)
            }
        }
    }
}

if (composeWinUiGradlePluginAvailable) {
    // The projections generated by kotlin-winrt need Kotlin language version 2.3 or newer. Modules
    // on the default language version of the fork can still read the 2.3 metadata of this one.
    androidx {
        kotlinTarget = androidx.build.KotlinTarget.KOTLIN_2_3
    }
    // With the kotlin-winrt plugin applied, KGP's source-set consistency check sees this version
    // on some source sets and the compiler default on others, so state it on every source set.
    kotlin.sourceSets.configureEach { sourceSet ->
        sourceSet.languageSettings.languageVersion = "2.3"
        sourceSet.languageSettings.apiVersion = "2.3"
    }

    configurations.configureEach { configuration ->
        def lowerName = configuration.name.toLowerCase(Locale.ROOT)
        if (lowerName.contains("winui")) {
            configuration.attributes.attribute(
                    org.gradle.api.attributes.java.TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE,
                    25
            )
            configuration.resolutionStrategy.dependencySubstitution {
                substitute(module("org.jetbrains.skiko:skiko"))
                        .using(module("io.github.compose-fluent:skiko-winui:${composeWinUiSkikoWinUiVersion.get()}"))
                        .because("compose-winui JVM uses skiko-winui as the WinUI replacement for the regular Skiko distribution.")
            }
        }
    }

    tasks.withType(KotlinCompile).configureEach { task ->
        if (task.name.contains("Winui")) {
            task.compilerOptions {
                it.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_25)
                it.freeCompilerArgs.add("-Xjdk-release=25")
                it.freeCompilerArgs.add("-opt-in=kotlin.time.ExperimentalTime")
            }
        }
    }

    tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach { task ->
        if (task.name.contains("Winui")) {
            task.enabled = false
        }
    }
}
