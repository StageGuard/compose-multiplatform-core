import java.util.zip.ZipFile
import org.jetbrains.kotlin.gradle.dsl.JvmTarget
import io.github.composefluent.windows.toolkit.gradle.RunWinAppHostTask
import io.github.composefluent.windows.toolkit.gradle.WindowsPackageType

plugins {
    id("AndroidXPlugin")
    id("AndroidXComposePlugin")
    id("org.jetbrains.kotlin.jvm")
    id("JetBrainsAndroidXPlugin")
    id("io.github.compose-fluent.windows-toolkit")
}

def composeWinUiSkikoWinUiVersion = providers
        .gradleProperty("composeWinUi.skikoWinUiVersion")
        .orElse("0.0.0-SNAPSHOT")

dependencies {
    def lifecycleVersion = project.redirectVersions.get('androidx.lifecycle')
    def kotlinWinRtVersion = project.findProperty("kotlinWinRt.version") ?: "0.1.0-SNAPSHOT"
    implementation(project(":compose:runtime:runtime"))
    implementation(project(":compose:ui:ui"))
    implementation(project(":compose:foundation:foundation"))
    implementation("androidx.lifecycle:lifecycle-viewmodel-compose:$lifecycleVersion")
    implementation("org.jetbrains.androidx.navigationevent:navigationevent-compose:1.1.0")
    implementation("io.github.compose-fluent:winrt-runtime-jvm:$kotlinWinRtVersion")
    implementation("io.github.compose-fluent:skiko-winui:${composeWinUiSkikoWinUiVersion.get()}")
}

def composeWinUiWindowsAppSdkVersion = providers
        .gradleProperty("composeWinUi.windowsAppSdkVersion")
        .orElse(providers.gradleProperty("kotlinWinRt.samples.windowsAppSdkVersion"))
        .orElse("2.2.0")

// The projections generated by kotlin-winrt need Kotlin language version 2.3 or newer.
androidx {
    kotlinTarget = androidx.build.KotlinTarget.KOTLIN_2_3
}

windows {
    application {
        mainClass = "androidx.compose.ui.winui.samples.WinUIViewSampleKt"
        // A loose layout that carries its own Windows App SDK runtime, started through the
        // generated host.
        packageType = WindowsPackageType.None
        selfContained()
    }
    packageReferences {
        // Only needed for its runtime assets: compose-ui and skiko-winui supply the projections.
        nugetPackage("Microsoft.WindowsAppSDK", composeWinUiWindowsAppSdkVersion.get()) {
            generateProjection = false
        }
    }
}

configurations.configureEach { configuration ->
    configuration.resolutionStrategy.dependencySubstitution {
        substitute(module("org.jetbrains.skiko:skiko"))
                .using(module("io.github.compose-fluent:skiko-winui:${composeWinUiSkikoWinUiVersion.get()}"))
                .because("compose-winui JVM uses skiko-winui as the WinUI replacement for the regular Skiko distribution.")
    }
    // KWINRT-056: kotlin-winrt does not regenerate the WinRT types that its dependencies already
    // project, so their projections have to be on the classpath of its projection compilation.
    // The plugin only adds project dependencies that are already configured, which configuration
    // on demand does not guarantee, and no external modules, so add both explicitly.
    if (configuration.name == "kotlinWinRTProjectionCompileClasspath") {
        configuration.dependencies.add(project.dependencies.project(path: ":compose:ui:ui"))
        configuration.dependencies.add(
                project.dependencies.create(
                        "io.github.compose-fluent:skiko-winui:${composeWinUiSkikoWinUiVersion.get()}"
                )
        )
    }
}

// KWINRT-057: JetBrains publishes its JVM redirect artifacts (e.g. org.jetbrains.androidx.
// lifecycle:lifecycle-common-jvm) as jars without classes, named like the androidx jar they
// depend on. The application host stages its runtime jars into one directory and rejects two
// jars with the same file name, so leave the jars without content out.
tasks.named("buildWinAppHostJvmMain").configure {
    def wiredRuntimeClasspath = files(runtimeClasspath.from.toList())
    runtimeClasspath.setFrom(wiredRuntimeClasspath.filter { file ->
        !(file.isFile() && file.name.endsWith(".jar") && new ZipFile(file).withCloseable { zip ->
            zip.entries().toList().every { it.isDirectory() || it.name.startsWith("META-INF/") }
        })
    })
}

// KWINRT-058: the application host loads jvm.dll of its bundled runtime by path, but the
// libraries the JVM loads next (zip.dll) import java.dll by name. With another JDK on PATH that
// JDK's java.dll is picked up and the VM fails to initialize, so put the bundled runtime first.
tasks.withType(RunWinAppHostTask).configureEach { task ->
    task.environmentVariables.put(
            "PATH",
            task.hostExecutable.map { executable ->
                def runtimeBin = new File(executable.asFile.parentFile, "runtime/bin")
                [runtimeBin.absolutePath, System.getenv("PATH")].findAll { it != null }
                        .join(File.pathSeparator)
            }
    )
}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(25))
    }
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

// KWINRT-060: kotlin-winrt puts the authored .winmd of this module into the runtime assets
// resources twice: from the compilation output and from the staged application package.
tasks.named("processResources").configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(JavaCompile).configureEach {
    sourceCompatibility = JavaVersion.VERSION_25.toString()
    targetCompatibility = JavaVersion.VERSION_25.toString()
    options.release.set(25)
}

// KWINRT-055: the authoring scanner of the published kotlin-winrt snapshot reads CRLF sources at
// the offsets of their LF-normalized text, which loses the package of every authored class in a
// checkout with core.autocrlf=true. Scan an LF copy until the fix on kotlin-winrt's xaml-support
// branch is published.
def prepareWinUiAuthoringSources = tasks.register("prepareWinUiAuthoringSources", Sync) {
    from(project.file("src/main/kotlin"))
    into(layout.buildDirectory.dir("generated/compose-winui/authoring-sources"))
    filter(
            org.apache.tools.ant.filters.FixCrLfFilter,
            eol: org.apache.tools.ant.filters.FixCrLfFilter.CrLf.newInstance("lf")
    )
}

tasks.named("generateWinRTProjections").configure {
    sourceRoots.setFrom(prepareWinUiAuthoringSources.map { it.destinationDir })
}

tasks.named("generateWinRTAuthoringCandidates").configure {
    dependsOn(prepareWinUiAuthoringSources)
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    compilerOptions {
        jvmTarget.set(JvmTarget.JVM_25)
        freeCompilerArgs.add("-Xjdk-release=25")
        freeCompilerArgs.add("-opt-in=kotlin.time.ExperimentalTime")
    }
}

def registerWinUISampleTask = { String taskName, String descriptionText, String mode = null, Closure extraConfig = null ->
    windows.application.runTask(taskName) { RunWinAppHostTask task ->
        task.group = "verification"
        task.description = descriptionText
        def sampleLog = layout.buildDirectory.file("validation/${taskName}.log")
        task.outputLog.set(sampleLog)
        // The sample is observed through its log, so every run has to start the application.
        task.outputs.upToDateWhen { false }
        def jvmOptions = [
                "-Dcompose.winui.sample.autoExit=true",
        ]
        if (mode != null) {
            jvmOptions.add("-Dcompose.winui.sample.mode=${mode}")
        }
        if (extraConfig != null) {
            extraConfig.delegate = jvmOptions
            extraConfig(jvmOptions)
        }
        task.jvmArgs.addAll(jvmOptions)
        task.doFirst {
            def runtimeClasspathNames = configurations.runtimeClasspath.files.collect { it.name }
            if (!runtimeClasspathNames.any { it.contains("skiko-winui") }) {
                throw new GradleException("WinUI sample runtime classpath does not include skiko-winui.")
            }
            if (runtimeClasspathNames.any { it.contains("skiko-awt-runtime") }) {
                throw new GradleException("WinUI sample runtime classpath must not include Skiko AWT runtime artifacts: $runtimeClasspathNames")
            }
        }
        task.doLast {
            def logText = sampleLog.get().asFile.text
            if (logText.contains("Exception in thread") ||
                    logText.contains("Error was captured in composition.") ||
                    logText.contains("Timed out waiting")) {
                throw new GradleException("WinUI sample reported an internal failure. See ${sampleLog.get().asFile}.")
            }
        }
    }
}

