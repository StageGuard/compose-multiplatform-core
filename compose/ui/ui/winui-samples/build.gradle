import org.jetbrains.kotlin.gradle.dsl.JvmTarget
import io.github.composefluent.windows.toolkit.gradle.RunWinAppHostTask
import io.github.composefluent.windows.toolkit.gradle.WindowsPackageType

plugins {
    id("AndroidXPlugin")
    id("AndroidXComposePlugin")
    id("org.jetbrains.kotlin.jvm")
    id("JetBrainsAndroidXPlugin")
    id("io.github.compose-fluent.windows-toolkit")
}

def composeWinUiSkikoWinUiVersion = providers
        .gradleProperty("composeWinUi.skikoWinUiVersion")
        .orElse("0.0.0-SNAPSHOT")

dependencies {
    def lifecycleVersion = project.redirectVersions.get('androidx.lifecycle')
    def kotlinWinRtVersion = project.findProperty("kotlinWinRt.version") ?: "0.1.0-SNAPSHOT"
    implementation(project(":compose:runtime:runtime"))
    implementation(project(":compose:ui:ui"))
    implementation(project(":compose:foundation:foundation"))
    implementation("androidx.lifecycle:lifecycle-viewmodel-compose:$lifecycleVersion")
    implementation("org.jetbrains.androidx.navigationevent:navigationevent-compose:1.1.0")
    implementation("io.github.compose-fluent:winrt-runtime-jvm:$kotlinWinRtVersion")
    implementation("io.github.compose-fluent:skiko-winui:${composeWinUiSkikoWinUiVersion.get()}")
}

def composeWinUiWindowsAppSdkVersion = providers
        .gradleProperty("composeWinUi.windowsAppSdkVersion")
        .orElse(providers.gradleProperty("kotlinWinRt.samples.windowsAppSdkVersion"))
        .orElse("2.2.0")
def composeWinUiWindowsAppSdkWinUiVersion = providers
        .gradleProperty("composeWinUi.windowsAppSdkWinUiVersion")
        .orElse("2.2.1")
def composeWinUiWindowsAppSdkDWriteVersion = providers
        .gradleProperty("composeWinUi.windowsAppSdkDWriteVersion")
        .orElse("2.1.0")

// The projections generated by kotlin-winrt need Kotlin language version 2.3 or newer.
androidx {
    kotlinTarget = androidx.build.KotlinTarget.KOTLIN_2_3
}

windows {
    application {
        mainClass = "androidx.compose.ui.winui.samples.WinUIViewSampleKt"
        // A loose layout that carries its own Windows App SDK runtime, started through the
        // generated host.
        packageType = WindowsPackageType.None
        selfContained()
    }
    packageReferences {
        // Only needed for its runtime assets: compose-ui and skiko-winui supply the projections.
        // The components that they declare, plus the runtime package, which has the version of
        // the runtime; not the Microsoft.WindowsAppSDK metapackage, which would bring the AI, ML
        // and Widgets runtimes as well.
        nugetPackage("Microsoft.WindowsAppSDK.WinUI", composeWinUiWindowsAppSdkWinUiVersion.get()) {
            generateProjection = false
        }
        nugetPackage("Microsoft.WindowsAppSDK.Runtime", composeWinUiWindowsAppSdkVersion.get()) {
            generateProjection = false
        }
        nugetPackage("Microsoft.WindowsAppSDK.DWrite", composeWinUiWindowsAppSdkDWriteVersion.get()) {
            generateProjection = false
        }
    }
}

configurations.configureEach { configuration ->
    configuration.resolutionStrategy.dependencySubstitution {
        substitute(module("org.jetbrains.skiko:skiko"))
                .using(module("io.github.compose-fluent:skiko-winui:${composeWinUiSkikoWinUiVersion.get()}"))
                .because("compose-winui JVM uses skiko-winui as the WinUI replacement for the regular Skiko distribution.")
    }
}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(25))
    }
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    sourceCompatibility = JavaVersion.VERSION_25.toString()
    targetCompatibility = JavaVersion.VERSION_25.toString()
    options.release.set(25)
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    compilerOptions {
        jvmTarget.set(JvmTarget.JVM_25)
        freeCompilerArgs.add("-Xjdk-release=25")
        freeCompilerArgs.add("-opt-in=kotlin.time.ExperimentalTime")
    }
}

def registerWinUISampleTask = { String taskName, String descriptionText, String mode = null, Closure extraConfig = null ->
    windows.application.runTask(taskName) { RunWinAppHostTask task ->
        task.group = "verification"
        task.description = descriptionText
        def sampleLog = layout.buildDirectory.file("validation/${taskName}.log")
        task.outputLog.set(sampleLog)
        // The sample is observed through its log, so every run has to start the application.
        task.outputs.upToDateWhen { false }
        def jvmOptions = [
                // Bounds the footprint of the sample host (KWINRT-064), with the bounds of
                // :compose:mpp:demo-winui, which are measured there.
                "-Xms8m",
                "-Xmx64m",
                "-Xss128k",
                "-XX:+UseSerialGC",
                "-XX:TieredStopAtLevel=1",
                "-XX:CICompilerCount=1",
                "-XX:ReservedCodeCacheSize=32m",
                "-XX:MaxMetaspaceSize=96m",
                "-XX:CompressedClassSpaceSize=64m",
                "-XX:-UsePerfData",
                "-Dfile.encoding=UTF-8",
                "-Dcompose.winui.sample.autoExit=true",
        ]
        if (mode != null) {
            jvmOptions.add("-Dcompose.winui.sample.mode=${mode}")
        }
        if (extraConfig != null) {
            extraConfig.delegate = jvmOptions
            extraConfig(jvmOptions)
        }
        task.jvmArgs.addAll(jvmOptions)
        task.doFirst {
            def runtimeClasspathNames = configurations.runtimeClasspath.files.collect { it.name }
            if (!runtimeClasspathNames.any { it.contains("skiko-winui") }) {
                throw new GradleException("WinUI sample runtime classpath does not include skiko-winui.")
            }
            if (runtimeClasspathNames.any { it.contains("skiko-awt-runtime") }) {
                throw new GradleException("WinUI sample runtime classpath must not include Skiko AWT runtime artifacts: $runtimeClasspathNames")
            }
        }
        task.doLast {
            def logText = sampleLog.get().asFile.text
            if (logText.contains("Exception in thread") ||
                    logText.contains("Error was captured in composition.") ||
                    logText.contains("Timed out waiting")) {
                throw new GradleException("WinUI sample reported an internal failure. See ${sampleLog.get().asFile}.")
            }
        }
    }
}

registerWinUISampleTask(
    "runWinUIViewSample",
    "Runs the minimal compose-winui WinUI smoke sample."
)
