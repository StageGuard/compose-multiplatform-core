import androidx.build.SoftwareType
import androidx.build.PlatformIdentifier
import org.jetbrains.kotlin.gradle.plugin.KotlinPlatformType
import org.jetbrains.kotlin.konan.target.Family

plugins {
    id("AndroidXPlugin")
    id("AndroidXComposePlugin")
    id("JetBrainsAndroidXPlugin")
    alias(libs.plugins.atomicFu)
}

def composeWinUiJvmTargetEnabled = providers
        .gradleProperty("composeWinUi.enableJvmTarget")
        .map { it.toBoolean() }
        .orElse(false)
        .get()
def composeWinUiGradlePluginAvailable = JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_22)
def composeWinUiSkikoWinUiVersion = providers
        .gradleProperty("composeWinUi.skikoWinUiVersion")
        .orElse("0.0.0-SNAPSHOT")
def composeWinUiWindowsSdkVersion = providers
        .gradleProperty("composeWinUi.windowsSdkVersion")
        .orElse("10.0.26100.0")

def composeWinUiMingwTargetEnabled = providers
        .gradleProperty("composeWinUi.enableMingwTarget")
        .map { it.toBoolean() }
        .orElse(false)
        .get()
def composeWinUiTargetEnabled = composeWinUiJvmTargetEnabled || composeWinUiMingwTargetEnabled

androidXMultiplatform {
    redirect("androidx.compose.ui") {
        androidLibrary {
            compileSdk = 35
            namespace = "org.jetbrains.androidx.compose.ui.text"
            androidResources.enable = true
        }
    }
    if (!composeWinUiJvmTargetEnabled) {
        desktop()
    }
    mac()
    ios()
    js()
    wasmJs()

    defaultPlatform(PlatformIdentifier.ANDROID)

    sourceSets {
        commonMain.dependencies {
            implementation(libs.kotlinCoroutinesCore)

            api(project(":compose:ui:ui-graphics"))
            api(project(":compose:ui:ui-unit"))

            // when updating the runtime version please also update the runtime-saveable version
            implementation(project(":compose:runtime:runtime"))
            implementation(project(":compose:runtime:runtime-saveable"))

            implementation(project(":compose:ui:ui-util"))

            // TODO: Pin androidx.collection when SieveCache is available
            implementation("androidx.collection:collection:1.6.0")
        }

        commonTest.dependencies {
            implementation(libs.kotlinTest)
        }

        nonAndroidMain {
            dependsOn(commonMain)
            dependencies {
                // ui-text is skia-free: the skia-backed font/paragraph backend lives in ui-skiko.
                implementation(libs.atomicFu)
            }
        }

        nonAndroidTest {
            dependsOn(commonTest)
            dependencies {
                implementation(project(":compose:ui:ui-skiko"))
                implementation(project(":kruth:kruth"))
            }
        }

        desktopMain {
            dependsOn(nonAndroidMain)
        }

        desktopTest {
            dependsOn(nonAndroidTest)
            dependencies {
                implementation(libs.truth)
                implementation(libs.junit)
                implementation(libs.skikoAwtRuntime)
                implementation(project(":compose:foundation:foundation"))
                implementation(project(":compose:ui:ui-test-junit4"))
                implementation(project(":internal-testutils-fonts"))
                implementation(libs.mockitoCore)
                implementation(libs.mockitoKotlin)
                implementation(libs.mockitoCore4)
                implementation(libs.mockitoKotlin4)
                implementation(libs.kotlinReflect)
            }
        }

        nonJvmMain {
            dependsOn(nonAndroidMain)
            dependencies {
                // To comply with Klib resolver until https://youtrack.jetbrains.com/issue/KT-61096 is fixed
                implementation("org.jetbrains.compose.collection-internal:collection:1.10.0")
            }
        }

        nonJvmTest {
            dependsOn(nonAndroidTest)
        }

        nativeMain {
            dependsOn(nonJvmMain)
        }

        nativeTest {
            dependsOn(nonJvmTest)
        }

        darwinMain {
            dependsOn(nativeMain)
        }

        darwinTest {
            dependsOn(nativeTest)
        }

        macosMain {
            dependsOn(darwinMain)
        }

        macosTest {
            dependsOn(darwinTest)
        }

        iosMain {
            dependsOn(darwinMain)
        }

        iosTest {
            dependsOn(darwinTest)
        }

        // TODO: Align it with AOSP or make explicit
        configureEach {
            languageSettings.optIn("androidx.compose.ui.text.ExperimentalTextApi")
        }
    }
}

androidx {
    name = "Compose UI Text"
    type = SoftwareType.PUBLISHED_LIBRARY_ONLY_USED_BY_KOTLIN_CONSUMERS
    inceptionYear = "2019"
    description = "Compose Text primitives and utilities"
    legacyDisableKotlinStrictApiMode = true
}

afterEvaluate {
    // needed to support running tests that use AwtFontUtils
    // (https://github.com/JetBrains/compose-multiplatform-core/pull/918)
    tasks.withType(Test) { t ->
        t.jvmArgs += ["--add-opens=java.desktop/sun.font=ALL-UNNAMED"]
    }
}

// Applied after androidXMultiplatform has applied the Kotlin plugin (see :compose:ui:ui).
if (composeWinUiGradlePluginAvailable && composeWinUiTargetEnabled) {
    apply plugin: "io.github.compose-fluent.windows-toolkit"

    windows {
        xaml {
            exportLibrarySchema = false
        }
        packageReferences {
            windowsSdk(composeWinUiWindowsSdkVersion.get(), false, true)
            // The locale of the WinUI targets is the WinRT one.
            type("Windows.Globalization.ApplicationLanguages")
            type("Windows.Globalization.Language")
        }
    }

    // The projections generated by kotlin-winrt need Kotlin language version 2.3 or newer; with
    // the plugin applied, KGP's source-set consistency check needs it on every source set (see
    // :compose:ui:ui).
    androidx {
        kotlinTarget = androidx.build.KotlinTarget.KOTLIN_2_3
    }
    kotlin.sourceSets.configureEach { sourceSet ->
        sourceSet.languageSettings.languageVersion = "2.3"
        sourceSet.languageSettings.apiVersion = "2.3"
    }
}

kotlin {
    if (composeWinUiGradlePluginAvailable && composeWinUiTargetEnabled) {
        if (composeWinUiJvmTargetEnabled) {
            jvm("winuiJvm")
        }
        if (composeWinUiMingwTargetEnabled) {
            mingwX64("winuiMingw")
        }

        sourceSets {
            // Shared by the WinUI JVM and native targets.
            winuiMain {
                dependsOn(nonAndroidMain)
                dependencies {
                    implementation("io.github.compose-fluent:skiko-winui:${composeWinUiSkikoWinUiVersion.get()}")
                }
            }

            winuiTest {
                dependsOn(commonTest)
                dependencies {
                    implementation(project(":compose:ui:ui-skiko"))
                    implementation(project(":kruth:kruth"))
                }
            }

            if (composeWinUiJvmTargetEnabled) {
                winuiJvmMain {
                    dependsOn(winuiMain)
                    dependsOn(jvmAndAndroidMain)
                }

                winuiJvmTest {
                    dependsOn(winuiTest)
                    dependencies {
                        runtimeOnly("io.github.compose-fluent:skiko-winui-windows:${composeWinUiSkikoWinUiVersion.get()}")
                    }
                }
            }

            if (composeWinUiMingwTargetEnabled) {
                winuiMingwMain {
                    dependsOn(winuiMain)
                    dependsOn(nativeMain)
                }
            }
        }
    }
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach { task ->
    if (task.name.contains("Winui")) {
        // winuiMain has the Locale of the WinUI targets.
        task.exclude("**/intl/Locale.jvmAndAndroid.kt")
        task.compilerOptions {
            jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_25)
            freeCompilerArgs.add("-Xjdk-release=25")
        }
    }
}

configurations.configureEach { configuration ->
    def lowerName = configuration.name.toLowerCase(Locale.ROOT)
    if (lowerName.contains("winui")) {
        if (!lowerName.contains("mingw")) {
            configuration.attributes.attribute(
                    org.gradle.api.attributes.java.TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE,
                    25
            )
        }
        configuration.resolutionStrategy.dependencySubstitution {
            substitute(module("org.jetbrains.skiko:skiko"))
                    .using(module("io.github.compose-fluent:skiko-winui:${composeWinUiSkikoWinUiVersion.get()}"))
                    .because("compose-winui JVM uses skiko-winui as the WinUI replacement for the regular Skiko distribution.")
        }
    }
}

tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach { task ->
    if (task.name.contains("Winui")) {
        task.enabled = false
    }
}
